# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    # Weekly (was daily) + grouped, the same shape as pharos-react: every
    # Dependabot PR runs the whole CI, and daily + ungrouped meant one PR per
    # package per day, each a full run, plus another on every rebase while the
    # others merged. Majors stay ungrouped so a breaking bump is reviewed on
    # its own. This keeps the dependabot-auto-merge workflow working: this
    # package declares only devDependencies (rule §8), so the group is
    # dev-only + non-major and still matches its
    # `dependency-type == direct:development && update-type != major` gate.
    schedule:
      interval: 'weekly'
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    # Match pnpm's `minimum-release-age` (7 days, .npmrc): do not propose a
    # version pnpm itself would refuse to resolve. Own-org packages are exempt.
    cooldown:
      default-days: 7
      exclude:
        - '@code-sherpas/*'
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # One grouped PR for all action bumps, to keep the PR count down.
    groups:
      github-actions:
        patterns:
          - '*'

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # kept for future npm Trusted Publishing (OIDC)

jobs:
  release:
    name: Version or publish via Changesets
    runs-on: ubuntu-latest
    steps:
      # Using a GitHub App token (instead of the default GITHUB_TOKEN) so that
      # PRs created by changesets trigger downstream workflows (ci.yml).
      # GitHub deliberately suppresses workflow_run events for activity
      # authored by GITHUB_TOKEN to avoid infinite loops — see the release runbook:
      # https://app.notion.com/p/4071751eee1081248ce6e7b9dc4e3976
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # Client ID of the code-sherpas-releases GitHub App. It is a public
          # identifier (GET /apps/code-sherpas-releases returns it), not a
          # credential: the private key below is the secret. app-id is
          # deprecated in create-github-app-token v3.
          client-id: Iv23lieM49a0M6cNMdHW
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install pnpm
        # Without `version`, it installs the pnpm in `packageManager`.
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          version-script: pnpm changeset version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # v2 reads a custom token only from this input, not from the
          # GITHUB_TOKEN environment variable, and pushes the release commit
          # through the GitHub API, attributed to the App.
          github-token: ${{ steps.app-token.outputs.token }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN: authentication to npm uses
          # Trusted Publishing (OIDC). permissions.id-token:write is set at
          # the workflow level; publishConfig.provenance:true in package.json
          # makes `npm publish` emit an attestation. See the release runbook:
          # https://app.notion.com/p/4071751eee1081248ce6e7b9dc4e3976
